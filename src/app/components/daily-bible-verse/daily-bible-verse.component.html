<ion-card class="card">
  <!-- Loading Spinner -->
  @if (isLoading) {
  <div class="verse-loading">
    <ion-spinner name="circles"></ion-spinner>
  </div>
  }

  <!-- Content - Only shown when not loading -->
  @if (!isLoading) {
  <div class="card-item-daily-items" style="min-height: 100px">
    <h4 class="title card-item-daiy-header">
      Daily Bible Verse
      <ion-icon
        name="ellipsis-horizontal"
        class="verse-menu-icon"
        style="
          font-size: 24px;
          float: right;
          margin-top: -2px;
          right: 20px;
          cursor: pointer;
          color: var(--app-text-primary);
        "
        (click)="showSettings($event)"
      ></ion-icon>
    </h4>
    <div class="card-item-daily-items-padding">
      <div
        class="home-dynamic-content"
        [ngStyle]="{ display: dailyVerse_top != '' ? 'block' : 'none' }"
        [innerHTML]="dailyVerse_top"
      ></div>
      <div style="width: 100%; text-align: center">
        <div class="verseoftheday" [innerHTML]="verseoftheday"></div>
        <div
          class="verseofthedayreference"
          [innerHTML]="verseoftheday_reference"
        ></div>
      </div>
      <div
        class="home-dynamic-content"
        [ngStyle]="{ display: dailyVerse_bottom != '' ? 'block' : 'none' }"
        [innerHTML]="dailyVerse_bottom"
      ></div>
    </div>
  </div>
  }
  <ion-popover
    class="verse-menu-popover"
    [isOpen]="menuOpen"
    [event]="menuEvent"
    [dismissOnSelect]="true"
    (didDismiss)="menuOpen = false"
  >
    <ng-template>
      <ion-list>
        <ion-item button [detail]="false" (click)="setLanguage()">
          <ion-icon name="language-outline" slot="start"></ion-icon>
          <ion-label>{{ dailyVerseLanguageAlternate }}</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="createImage()">
          <ion-icon name="image-outline" slot="start"></ion-icon>
          <ion-label>Image</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="shareContent('COPY')">
          <ion-icon name="copy-outline" slot="start"></ion-icon>
          <ion-label>Copy</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="shareContent('COPY_ALL')">
          <ion-icon name="documents-outline" slot="start"></ion-icon>
          <ion-label>Copy All</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="shareContent('SHARE')">
          <ion-icon name="share-social-outline" slot="start"></ion-icon>
          <ion-label>Share</ion-label>
        </ion-item>
        <ion-item button [detail]="false" lines="none" (click)="shareContent('SHARE_ALL')">
          <ion-icon name="share-outline" slot="start"></ion-icon>
          <ion-label>Share All</ion-label>
        </ion-item>
      </ion-list>
    </ng-template>
  </ion-popover>
</ion-card>
